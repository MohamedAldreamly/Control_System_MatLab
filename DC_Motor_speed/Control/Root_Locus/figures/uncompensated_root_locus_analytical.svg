xt-anchor="start">EIGHT-STEP CONSTRUCTION</text><text x="906" y="186" fill="#253246" font-size="15" font-weight="400" text-anchor="start">1. Poles: −6 ± √15.98; zeros: none</text><text x="906" y="222" fill="#253246" font-size="15" font-weight="400" text-anchor="start">2. D(s) + 2K = 0</text><text x="906" y="258" fill="#253246" font-size="15" font-weight="400" text-anchor="start">3. Real-axis segment: between poles</text><text x="906" y="294" fill="#253246" font-size="15" font-weight="400" text-anchor="start">4. Two branches → infinity</text><text x="906" y="330" fill="#253246" font-size="15" font-weight="400" text-anchor="start">5. Centroid −6; angles 90°, 270°</text><text x="906" y="366" fill="#253246" font-size="15" font-weight="400" text-anchor="start">6. No complex open-loop poles/zeros</text><text x="906" y="402" fill="#253246" font-size="15" font-weight="400" text-anchor="start">7. Routh: stable for every K ≥ 0</text><text x="906" y="438" fill="#253246" font-size="15" font-weight="400" text-anchor="start">    No finite jω crossing for K ≥ 0</text><text x="906" y="474" fill="#253246" font-size="15" font-weight="400" text-anchor="start">8. Breakaway: s = −6, K = 7.99</text><rect x="902" y="523" width="332" height="105" rx="9" fill="#eff6ff" stroke="#bdd4f3"/><text x="919" y="550" fill="#0e315d" font-size="16" font-weight="700" text-anchor="start">SELECTED POINT AFTER PLOTTING</text><text x="919" y="575" fill="#6d28d9" font-size="17" font-weight="400" text-anchor="start">sᵈ = −6 ± j2   →   K = 9.99</text><text x="919" y="603" fill="#253246" font-size="16" font-weight="400" text-anchor="start">Tₛ ≈ 0.667 s; ζ ≈ 0.949</text><text x="47" y="647" fill="#0e315d" font-size="16" font-weight="700" text-anchor="start">Legend:</text><path d="M129 633 L145 649 M145 633 L129 649" stroke="#d62b35" stroke-width="4" stroke-linecap="round"/><text x="155" y="647" fill="#253246" font-size="16" font-weight="400" text-anchor="start">open-loop pole</text><rect x="310" y="635" width="12" height="12" fill="#7c3aed"/><text x="329" y="647" fill="#253246" font-size="16" font-weight="400" text-anchor="start">selected closed-loop pole</text><line x1="572" y1="641" x2="600" y2="641" stroke="#1558c4" stroke-width="4" /><text x="608" y="647" fill="#253246" font-size="16" font-weight="400" text-anchor="start">root locus</text><line x1="738" y1="641" x2="770" y2="641" stroke="#168b60" stroke-width="2" stroke-dasharray="5 4"/><text x="777" y="647" fill="#253246" font-size="16" font-weight="400" text-anchor="start">ζ boundary</text><text x="47" y="681" fill="#64748b" font-size="14" font-weight="400" text-anchor="start">Source: analytic rules, no MATLAB-generated locus; diagram is vector-based (SVG).</text></svg>